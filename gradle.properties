# Gradle JVM options tuned for CI to avoid D8 / R8 OOM during dexing
# Increase heap and metaspace so the Gradle daemon has enough memory on GitHub runners
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx1536m -Dkotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true
