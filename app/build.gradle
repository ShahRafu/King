// Simple module-level Gradle build file for the Android app module (groovy)
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

/*
 * PORCUPINE_* values can be supplied via:
 *  - gradle.properties (local, not committed), e.g.
 *      PORCUPINE_ENABLED=true
 *      PORCUPINE_ACCESS_KEY=your_key_here
 *      PORCUPINE_KEYWORD_FILENAME=my_keyword.ppn
 *  - or -P flags at build time.
 */
def porcupineAccessKey = project.hasProperty('PORCUPINE_ACCESS_KEY') ? project.property('PORCUPINE_ACCESS_KEY') : ""
def porcupineKeywordFile = project.hasProperty('PORCUPINE_KEYWORD_FILENAME') ? project.property('PORCUPINE_KEYWORD_FILENAME') : "your_keyword.ppn"
def porcupineEnabledProp = project.hasProperty('PORCUPINE_ENABLED') ? project.property('PORCUPINE_ENABLED').toBoolean() : false

android {
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.shahrafuking.kingassistant"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "0.1"

        // Expose BuildConfig values; you can set these via gradle.properties or local.properties via -P
        buildConfigField "boolean", "PORCUPINE_ENABLED", porcupineEnabledProp.toString()
        buildConfigField "String", "PORCUPINE_ACCESS_KEY", "\"${porcupineAccessKey}\""
        buildConfigField "String", "PORCUPINE_KEYWORD_FILENAME", "\"${porcupineKeywordFile}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Java/Kotlin compatibility
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    // Kotlin stdlib (match Kotlin plugin version in project-level build.gradle)
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"

    // AndroidX core + UI
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'

    // Compose (kept as in original scaffold; optional UI usage)
    implementation 'androidx.activity:activity-compose:1.7.0'
    implementation 'androidx.compose.ui:ui:1.4.0'
    implementation 'androidx.compose.material:material:1.4.0'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.4.0'

    // Coroutines for background tasks
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // HTTP client for translation calls
    implementation "com.squareup.okhttp3:okhttp:4.11.0"

    // ML Kit language identification (on-device)
    implementation "com.google.mlkit:language-id:17.0.0"

    // Encrypted SharedPreferences used by LocalStore
    implementation "androidx.security:security-crypto:1.1.0"

    // Standard AndroidX and Compose tooling
    debugImplementation "androidx.compose.ui:ui-tooling:1.4.0"

    // Porcupine SDK placeholder - uncomment & set correct version when ready:
    // implementation 'ai.picovoice:porcupine-android:VERSION'
}
