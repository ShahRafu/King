// Module-level build.gradle (app). Replace or merge with your existing app/build.gradle
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def porcupineAccessKey = project.hasProperty('PORCUPINE_ACCESS_KEY') ? project.property('PORCUPINE_ACCESS_KEY') : ""
def porcupineKeywordFile = project.hasProperty('PORCUPINE_KEYWORD_FILENAME') ? project.property('PORCUPINE_KEYWORD_FILENAME') : "your_keyword.ppn"
def porcupineEnabledProp = project.hasProperty('PORCUPINE_ENABLED') ? project.property('PORCUPINE_ENABLED').toBoolean() : false

android {
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.shahrafuking.kingassistant"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "0.1"

        buildConfigField "boolean", "PORCUPINE_ENABLED", porcupineEnabledProp.toString()
        buildConfigField "String", "PORCUPINE_ACCESS_KEY", "\"${porcupineAccessKey}\""
        buildConfigField "String", "PORCUPINE_KEYWORD_FILENAME", "\"${porcupineKeywordFile}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'

    implementation 'androidx.activity:activity-compose:1.7.0'
    implementation 'androidx.compose.ui:ui:1.4.0'
    implementation 'androidx.compose.material:material:1.4.0'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.4.0'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation "com.google.mlkit:language-id:17.0.0"
    implementation "androidx.security:security-crypto:1.1.0"

    debugImplementation "androidx.compose.ui:ui-tooling:1.4.0"

    // Room
    implementation "androidx.room:room-runtime:2.5.2"
    implementation "androidx.room:room-ktx:2.5.2"
    kapt "androidx.room:room-compiler:2.5.2"

    // SQLCipher
    implementation "net.zetetic:android-database-sqlcipher:4.5.0"

    // TensorFlow Lite runtime (for Speaker verification)
    implementation "org.tensorflow:tensorflow-lite:2.11.0"
    implementation "org.tensorflow:tensorflow-lite-support:0.4.4"

    // TTS (core Android TTS used; no dep required usually)
    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'androidx.room:room-testing:2.5.2'
}
