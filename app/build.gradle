plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.shahrafuking.kingassistant"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1"

        buildConfigField "boolean", "PORCUPINE_ENABLED", porcupineEnabledProp.toString()
        buildConfigField "String", "PORCUPINE_ACCESS_KEY", "\"${porcupineAccessKey}\""
        buildConfigField "String", "PORCUPINE_KEYWORD_FILENAME", "\"${porcupineKeywordFile}\""
    }

    buildTypes {
        release {
            isMinifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}
