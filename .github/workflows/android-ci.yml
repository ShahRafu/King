name: Android CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform tools + build-tools)
        uses: android-actions/setup-android@v4
        with:
          api-level: 35
          build-tools: 35.0.0

      - name: Ensure gradlew is executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Build / Test using project Gradle wrapper (fail fast if missing)
        run: |
          set -eux
          if [ -x ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ] && [ "$(stat -c%s ./gradle/wrapper/gradle-wrapper.jar)" -gt 1024 ]; then
            echo "Using project Gradle wrapper"
            ./gradlew test --no-daemon --stacktrace --info --warning-mode=all
          else
            echo "ERROR: gradlew or gradle/wrapper/gradle-wrapper.jar is missing or invalid. Commit the project Gradle wrapper (gradlew + gradle/wrapper/gradle-wrapper.jar) to the repo and re-run." >&2
            exit 1
          fi
