name: Android CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # If present, make wrapper executable
      - name: Ensure gradlew is executable (if present)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      # If no wrapper or gradle command, install gradle via SDKMAN (fallback)
      - name: Ensure Gradle available (install via SDKMAN if needed)
        run: |
          set -eux
          if command -v gradle >/dev/null 2>&1; then
            echo "gradle already available"
          else
            curl -s "https://get.sdkman.io" | bash
            source "$HOME/.sdkman/bin/sdkman-init.sh"
            sdk install gradle 8.4.1
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      - name: Run unit tests
        run: |
          set -eux
          # Only use the wrapper if the script, wrapper JAR are present and the JAR looks valid.
          # Some commits have a corrupted gradle-wrapper.jar (size=1) which causes
          # "Could not find or load main class org.gradle.wrapper.GradleWrapperMain".
          if [ -x ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ] && [ "$(stat -c%s ./gradle/wrapper/gradle-wrapper.jar)" -gt 1024 ]; then
            echo "Using project Gradle wrapper"
            ./gradlew test --no-daemon --stacktrace
          else
            echo "Wrapper missing or invalid — using system Gradle (SDKMAN or preinstalled)"
            gradle test --no-daemon --stacktrace
          fi
