name: Android CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # If present, make wrapper executable
      - name: Ensure gradlew is executable (if present)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      # If no wrapper or gradle command, install gradle via SDKMAN (fallback)
      - name: Ensure Gradle available (install via SDKMAN if needed)
        run: |
          set -eux
          if command -v gradle >/dev/null 2>&1; then
            echo "gradle already available"
          else
            curl -s "https://get.sdkman.io" | bash
            source "$HOME/.sdkman/bin/sdkman-init.sh"
            sdk install gradle 8.4.1
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      - name: Run unit tests
        run: |
          set -eux
          # Prefer using the project gradle wrapper if present and executable.
          if [ -x ./gradlew ]; then
            ./gradlew test --no-daemon --stacktrace
          else
            gradle test --no-daemon --stacktrace
          fi
