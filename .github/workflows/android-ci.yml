name: Android CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform tools + build-tools)
        uses: android-actions/setup-android@v4
        with:
          api-level: 35
          build-tools: 35.0.0

      # If present, make wrapper executable
      - name: Ensure gradlew is executable (if present)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      # Ensure Gradle available: download a specific Gradle distribution (8.6) and add to PATH
      - name: Ensure Gradle 8.6 available (download & setup)
        run: |
          set -eux
          GRADLE_VERSION=8.6
          GRADLE_ZIP=gradle-${GRADLE_VERSION}-bin.zip
          INSTALL_DIR="$HOME/.gradle-dist/gradle-${GRADLE_VERSION}"
          mkdir -p "$INSTALL_DIR"
          curl -sSLo /tmp/${GRADLE_ZIP} https://services.gradle.org/distributions/${GRADLE_ZIP}
          unzip -q /tmp/${GRADLE_ZIP} -d "$HOME/.gradle-dist"
          export PATH="$INSTALL_DIR/bin:$PATH"
          echo "Gradle version: $(gradle -v)"

      - name: Regenerate Gradle wrapper if missing or corrupted
        run: |
          set -eux
          # Regenerate only if wrapper JAR missing or suspiciously small
          if [ ! -f ./gradle/wrapper/gradle-wrapper.jar ] || [ "$(stat -c%s ./gradle/wrapper/gradle-wrapper.jar)" -le 1024 ]; then
            echo "Regenerating gradle wrapper to 8.6"
            gradle wrapper --gradle-version 8.6
            chmod +x gradlew || true

            # Commit and push the newly generated wrapper back to the branch so future runs use it.
            # This requires write permission on GITHUB_TOKEN (set at top) and branch push rights.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties || true
            # Only commit if there are changes
            if [ -n "$(git status --porcelain)" ]; then
              git commit -m "ci: regenerate gradle wrapper (generated by workflow)" || true
              BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}")
              git push "https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${BRANCH_NAME} || echo "Push failed (branch protection or token permissions)"
            else
              echo "No wrapper changes to commit"
            fi
          else
            echo "gradle-wrapper.jar looks valid (size > 1024)"
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      - name: Run unit tests (with debug)
        run: |
          set -eux
          # Only use the wrapper if both the script and wrapper JAR are present and the JAR looks valid.
          if [ -x ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ] && [ "$(stat -c%s ./gradle/wrapper/gradle-wrapper.jar)" -gt 1024 ]; then
            echo "Using project Gradle wrapper"
            ./gradlew test --no-daemon --stacktrace --info
          else
            echo "Using downloaded Gradle (8.6)"
            gradle test --no-daemon --stacktrace --info
          fi
