name: Android CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform tools + build-tools)
        uses: android-actions/setup-android@v4
        with:
          api-level: 35
          build-tools: 35.0.0

      # If present, make wrapper executable
      - name: Ensure gradlew is executable (if present)
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      # If no wrapper or gradle command, install gradle via SDKMAN (fallback)
      - name: Ensure Gradle available (install via SDKMAN if needed)
        run: |
          set -eux
          if command -v gradle >/dev/null 2>&1; then
            echo "gradle already available"
          else
            curl -s "https://get.sdkman.io" | bash
            source "$HOME/.sdkman/bin/sdkman-init.sh"
            sdk install gradle 8.4.1
          fi

      - name: Regenerate Gradle wrapper if missing or corrupted
        run: |
          set -eux
          # Regenerate only if wrapper JAR missing or suspiciously small
          if [ ! -f ./gradle/wrapper/gradle-wrapper.jar ] || [ "$(stat -c%s ./gradle/wrapper/gradle-wrapper.jar)" -le 1024 ]; then
            echo "Regenerating gradle wrapper to 8.4.1"
            gradle wrapper --gradle-version 8.4.1
            chmod +x gradlew || true

            # Commit and push the newly generated wrapper back to the branch so future runs use it.
            # This requires write permission on GITHUB_TOKEN (set at top) and branch push rights.
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties || true
            # Only commit if there are changes
            if [ -n "$(git status --porcelain)" ]; then
              git commit -m "ci: regenerate gradle wrapper (generated by workflow)" || true
              BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}")
              git push "https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${BRANCH_NAME} || echo "Push failed (branch protection or token permissions)"
            else
              echo "No wrapper changes to commit"
            fi
          else
            echo "gradle-wrapper.jar looks valid (size > 1024)"
          fi

      - name: Print Java and Gradle versions
        run: |
          set -eux
          echo "=== java -version ==="
          java -version || true
          echo "=== gradle (wrapper if present) -v ==="
          if [ -x ./gradlew ]; then
            ./gradlew -v || true
          else
            gradle -v || true
          fi

      - name: Force Gradle project evaluation (debug)
        run: |
          set -eux
          # Run tasks to force configuration and show debug stacktrace
          if [ -x ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew tasks --all --no-daemon --stacktrace --debug || true
          else
            gradle tasks --all --no-daemon --stacktrace --debug || true
          fi

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      - name: Run unit tests (with debug)
        run: |
          set -eux
          # Only use the wrapper if both the script and wrapper JAR are present and the JAR looks valid.
          if [ -x ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ] && [ "$(stat -c%s ./gradle/wrapper/gradle-wrapper.jar)" -gt 1024 ]; then
            echo "Using project Gradle wrapper"
            ./gradlew test --no-daemon --stacktrace --info || true
          else
            echo "Wrapper missing or invalid — using system Gradle (installed via SDKMAN or preinstalled)"
            gradle test --no-daemon --stacktrace --info || true
          fi

      - name: Upload Gradle debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-debug-artifacts
          path: |
            build/reports/**
            build/reports/problems/**
            gradle/wrapper/gradle-wrapper.properties
            gradle/wrapper/gradle-wrapper.jar
            settings.gradle
            build.gradle
            app/build.gradle
            ~/.gradle/daemon/**
