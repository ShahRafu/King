name: Build APK and Publish Release

# trigger
on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform tools + build-tools)
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Accept Android SDK licenses
        run: |
          set -e
          if [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Ensure gradlew is executable
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Build Release APK
        run: |
          set -eux
          # Prefer project Gradle wrapper when present and valid
          if [ -x ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ] && [ "$(stat -c%s ./gradle/wrapper/gradle-wrapper.jar)" -gt 1024 ]; then
            echo "Using project Gradle wrapper"
            ./gradlew clean assembleRelease --no-daemon -PbuildFlowServiceProperty=false --stacktrace --warning-mode=all
          else
            echo "Wrapper missing/invalid — falling back to system Gradle if available"
            if command -v gradle >/dev/null 2>&1; then
              gradle clean assembleRelease --no-daemon -PbuildFlowServiceProperty=false --stacktrace --warning-mode=all
            else
              echo "No Gradle wrapper and no system gradle available. Please commit gradlew and gradle/wrapper/gradle-wrapper.jar"
              exit 1
            fi
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: apk-${{ github.sha }}
          name: APK build for ${{ github.sha }}
          body: >-
            Automated release APK build for commit ${{ github.sha }}.
            Branch: ${{ github.ref }}
            Built by GitHub Actions.

      - name: Upload Release APK
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/release/app-release-unsigned.apk
          asset_name: KingAssistant-app-release-${{ github.sha }}-unsigned.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Output release info
        run: |
          echo "Release created: ${{ steps.create_release.outputs.html_url || 'no-url' }}"
