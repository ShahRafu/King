name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute for local scripts
        run: |
          chmod +x scripts/autoagent/autoagent_local.sh || true

      - name: ktlint check
        run: ./gradlew ktlintCheck --no-daemon -PbuildFlowServiceProperty=false --stacktrace

      - name: detekt
        run: ./gradlew detekt --no-daemon -PbuildFlowServiceProperty=false --stacktrace

      - name: Run unit tests
        run: ./gradlew test --no-daemon -PbuildFlowServiceProperty=false --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon -PbuildFlowServiceProperty=false --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/test-results/**
            app/build/outputs/**
