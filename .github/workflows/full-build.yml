name: Full Build (APK & AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk: '25.2.9519653'
          cmake: '3.22.1'

      - name: Accept Android SDK licenses
        run: |
          set -e
          if [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew || true

      - name: Run ktlint
        run: ./gradlew ktlintCheck --no-daemon -PbuildFlowServiceProperty=false --stacktrace || true

      - name: Run detekt
        run: ./gradlew detekt --no-daemon -PbuildFlowServiceProperty=false --stacktrace || true

      - name: Run unit tests
        run: ./gradlew test --no-daemon -PbuildFlowServiceProperty=false --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon -PbuildFlowServiceProperty=false --stacktrace

      - name: Build Release AAB and APK (unsigned by default)
        run: |
          set -eux
          ./gradlew clean bundleRelease assembleRelease --no-daemon -PbuildFlowServiceProperty=false --stacktrace

      - name: Prepare signing key (from secrets)
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > release.keystore
          echo "Keystore written: $(ls -l release.keystore)"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Sign Release APK (if keystore present)
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        run: |
          set -eux
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" app/build/outputs/apk/release/app-release-unsigned.apk "$KEY_ALIAS"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Align Release APK (if signed)
        if: ${{ secrets.KEYSTORE_B64 != '' }}
        run: |
          set -eux
          sudo apt-get update && sudo apt-get install -y zipalign || true
          zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.aab

      - name: Create GitHub Release (if release build produced)
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        id: create_release
        with:
          tag_name: full-build-${{ github.sha }}
          name: Full build ${{ github.sha }}
          body: Automated full build (debug + release) for commit ${{ github.sha }}

      - name: Upload release assets
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url || '' }}
          asset_path: app/build/outputs/apk/release/app-release.apk
          asset_name: KingAssistant-app-release-${{ github.sha }}.apk
          asset_content_type: application/vnd.android.package-archive
